# Sample configuration
# Logging level for the application. One of debug, info, warn, or error
log-level: "info"
# Port to listen on
port: 8080
# MQTT configuration
mqtt:
  # MQTT broker address, e.g. mqtt://mqtt.example.com:1883. Required
  # broker: ""
  # Client ID for MQTT connection
  client-id: "wheresmyscope"
  # Prefix for MQTT topics
  prefix: "wheresmyscope"
  # Username for MQTT connection
  # username: ""
  # Password for MQTT connection
  # password: "(secret)"
# Image configuration
image:
  # Projection type. One of AZP, SZP, TAN, STG, SIN, ARC, ZEA, AIR, CYP, CEA, CAR, MER, SFL, PAR, MOL, AIT, TSC, CSC, QSC, HPX, XPH
  projection: "STG"
  # Field of view in degrees
  fov: 3.3
  # Image format. One of png, jpeg, or fits
  format: "png"
  # Image width in pixels
  width: 900
  # Image height in pixels
  height: 600
  # Stretch type for png and jpeg images. One of power, linear, sqrt, log, or asinh
  stretch: "linear"
  # Minimum value for the stretch, between 0 and 100. Only used for png and jpeg images
  min-cut: 0.5
  # Maximum value for the stretch, between 0 and 100. Only used for png and jpeg images
  max-cut: 99.5
  # HiPS survey to render the image from
  hips: "CDS/P/DSS2/color"
# CORS allowed origins
cors-allowed-origins: ["https://*", "http://*"]
# The observatory's own newest sub of the target, from astro-stacker
public-frame:
  # astro-stacker's base URL, e.g. http://astro-stacker.astro-processing:8080; empty shows only survey images
  # stacker-url: ""
  # This service's public base URL, which the page loads the frame from
  public-url: "https://wheresmyscope.mcswain.dev"
  # Seconds between checks for a newer frame
  interval-seconds: 60
  # Seconds before a fetch from the stacker gives up and the survey image is shown
  timeout-seconds: 10
